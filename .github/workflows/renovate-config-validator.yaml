name: renovate-config-validator
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/renovate-config-validator.yaml
      - renovate.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/renovate-config-validator.yaml
      - renovate.json
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v3.3.0
        with:
          persist-credentials: false
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@v2.4.1
